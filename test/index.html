<!doctype html>
<html>
  <head>
    <title>Vega WebGPU Renderer Test</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>%E2%9A%A1</text></svg>"
    />
    <script src="../releases/versions.js"></script>
    <script>
      function loadScript(src, callback) {
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = src;
        script.onload = callback;
        document.head.appendChild(script);
      }

      function getQueryParam(param) {
        return new URLSearchParams(window.location.search).get(param);
      }

      const releasedVersions = typeof vegaWebGPURendererVersions !== 'undefined' ? vegaWebGPURendererVersions : [];
      // build/ is gitignored, so the dev bundle only exists when serving the
      // repo locally. Hosted pages default to the newest release instead.
      const isLocalHost = ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
      const defaultVersion = isLocalHost || releasedVersions.length === 0 ? 'dev' : releasedVersions[0];
      const version = getQueryParam('version') || defaultVersion;
      const isDev = version === 'dev';
      const major = isDev ? Infinity : parseInt(version.split(/[._]/)[0], 10);
      console.log(`Vega WebGPU Renderer ${version}`);

      const rendererUrl = isDev
        ? '../build/vega-webgpu-renderer.js'
        : `../releases/${version.replaceAll('.', '_')}/vega-webgpu-renderer.js`;

      // Renderer versions before 2.0 were built for Vega 5 and require d3 globals.
      const vegaUrl =
        major >= 2
          ? 'https://cdn.jsdelivr.net/npm/vega@6.2.0/build/vega.min.js'
          : 'https://cdn.jsdelivr.net/npm/vega@5.33.1/build/vega.min.js';

      function boot() {
        loadScript(vegaUrl, function () {
          loadScript(rendererUrl, function () {
            loadScript('./index.js');
          });
        });
      }

      if (major >= 2) {
        boot();
      } else {
        loadScript('https://d3js.org/d3.v4.min.js', boot);
      }
    </script>
  </head>

  <body>
    <div id="header">
      &nbsp; <span class="label">Vega Specification:</span>
      <select id="specs">
        <option value="">-----</option>
      </select>
      &nbsp; <span class="label">Renderer:</span>
      <select id="render">
        <option value="svg">svg</option>
        <option value="canvas">canvas</option>
        <option value="webgpu" selected>webgpu</option>
      </select>
      &nbsp; <span class="label">Version:</span>
      <select id="versions"></select>
      &nbsp;
      <span id="fpsDisplay" class="label"></span>
    </div>
    <script src="./fps.js"></script>
    <div>
      <div id="vis"></div>
    </div>
    <div id="external"></div>
  </body>
</html>
