<!doctype html>
<html>
  <head>
    <title>Vega WebGPU Renderer Test</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./compare-ui.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <script src="../releases/versions.js"></script>
    <script>
      /** Loads the first source that answers, so a list is fallbacks in order. */
      function loadScript(src, callback) {
        const urls = Array.isArray(src) ? src.slice() : [src];
        const tried = [];
        (function next() {
          const url = urls.shift();
          if (url === undefined) {
            console.error(`[vega-webgpu] none of these loaded: ${tried.join(', ')}`);
            return;
          }
          tried.push(url);
          const script = document.createElement('script');
          script.type = 'text/javascript';
          script.src = url;
          script.onload = callback;
          script.onerror = next;
          document.head.appendChild(script);
        })();
      }

      function getQueryParam(param) {
        return new URLSearchParams(window.location.search).get(param);
      }

      const releasedVersions = typeof vegaWebGPURendererVersions !== 'undefined' ? vegaWebGPURendererVersions : [];
      // build/ is gitignored, so the dev bundle only exists when serving the
      // repo locally. Hosted pages default to the newest release, and an
      // explicit ?version=dev falls back rather than 404ing.
      const devAvailable = ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
      const newest = releasedVersions[0];
      let version = getQueryParam('version') || (devAvailable || !newest ? 'dev' : newest);
      if (version === 'dev' && !devAvailable && newest) {
        console.warn(`[vega-webgpu] The dev bundle is only served locally, using ${newest} instead.`);
        version = newest;
      }
      const isDev = version === 'dev';
      window.__devAvailable = devAvailable;
      window.__rendererVersion = version;
      const major = isDev ? Infinity : parseInt(version.split(/[._]/)[0], 10);
      console.log(`Vega WebGPU Renderer ${version}`);

      const rendererUrl = isDev
        ? '../build/vega-webgpu-renderer.js'
        : `../releases/${version.replaceAll('.', '_')}/vega-webgpu-renderer.js`;

      // Renderer versions before 2.0 were built for Vega 5 and require d3 globals.
      // Pinned to 5.19.1: later 5.x turned Renderer into a class, which the old
      // bundles cannot subclass (they call Renderer.call(this)).
      // ?vega=<name> loads a local build from test/vendor/vega-<name>.js, for
      // comparing an upstream change against the released one. Not committed.
      // The installed copy comes first, so a local run matches the render
      // harness and needs no network. The hosted page has no node_modules and
      // falls through to the cdn, pinned so a vega release cannot change this
      // page under the tests that drive it.
      const vegaBuild = getQueryParam('vega');
      const vegaUrl =
        vegaBuild && /^[a-z-]+$/.test(vegaBuild)
          ? [`./vendor/vega-${vegaBuild}.js`]
          : major >= 2
            ? ['../node_modules/vega/build/vega.min.js', 'https://cdn.jsdelivr.net/npm/vega@6.2.0/build/vega.min.js']
            : ['https://cdn.jsdelivr.net/npm/vega@5.19.1/build/vega.min.js'];

      function boot() {
        loadScript(vegaUrl, function () {
          loadScript(rendererUrl, function () {
            loadScript('./index.js');
          });
        });
      }

      if (major >= 2) {
        boot();
      } else {
        loadScript('https://d3js.org/d3.v4.min.js', boot);
      }
    </script>
  </head>

  <body>
    <aside>
      <header>
        <input id="specFilter" type="search" placeholder="filter specs" autocomplete="off" />
      </header>
      <div id="specList"></div>
    </aside>

    <main>
      <div id="page">
        <div id="header">
          <span class="label">Renderer:</span>
          <select id="render">
            <option value="svg">svg</option>
            <option value="canvas">canvas</option>
            <option value="webgpu" selected>webgpu</option>
          </select>
          <span class="label">Version:</span>
          <select id="versions"></select>
          <label class="label" title="Draw the spec with both renderers, stacked in one place"
            ><input type="checkbox" id="compare" /> compare</label
          >
          <label class="label" title="Mark what the two renderers put a different colour on"
            ><input type="checkbox" id="diff" /> diff</label
          >
          <label class="label" id="thresholdLabel" hidden>
            ignore under
            <input type="number" id="diffThreshold" min="0" max="255" step="1" value="3" />
          </label>
          <label class="label" id="styleLabel" hidden>
            <select id="diffStyle">
              <option value="mask" selected>marks only</option>
              <option value="heat">green to red</option>
              <option value="over">over webgpu</option>
            </select>
          </label>
          <label class="label" id="colorLabel" hidden>
            <input type="color" id="diffColor" value="#e4572e" aria-label="mark colour" />
          </label>
          <label
            class="label"
            id="driveLabel"
            hidden
            title="Two views on one page take turns on one thread, so the slower one holds the faster one back. Run one at a time to see its own speed."
          >
            run
            <select id="drive">
              <option value="both" selected>both</option>
              <option value="canvas">canvas only</option>
              <option value="webgpu">webgpu only</option>
            </select>
          </label>
          <span id="fpsDisplay" class="label"></span>
        </div>
        <script src="./fps.js"></script>
        <script src="./measures.js"></script>
        <script src="./compare-core.js"></script>
        <script src="./compare-ui.js"></script>
        <div id="visStage" class="stage">
          <div id="visSolo"><div id="vis"></div></div>
        </div>
        <div id="panels" hidden>
          <div id="viewRow">
            <div class="modes" id="viewModes">
              <button
                data-view="wipe"
                aria-pressed="true"
                title="Both in one place, with the divider deciding where canvas ends and webgpu begins"
              >
                wipe
              </button>
              <button
                data-view="blink"
                aria-pressed="false"
                title="Both in one place, alternating once a second. A shift of a pixel is easier to catch in motion than across a divider"
              >
                blink
              </button>
              <button data-view="side" aria-pressed="false" title="The two next to each other, scrolling together">
                side by side
              </button>
            </div>
            <span id="wipeControls" class="label">
              <input
                type="range"
                id="wipe"
                min="0"
                max="100"
                step="0.5"
                value="50"
                aria-label="position of the divider between canvas and webgpu"
              />
              <span id="wipeReadout">canvas 50%</span>
            </span>
            <label class="label" id="blinkBox" title="How long each of the two stays on screen">
              every
              <select id="blinkRate">
                <option value="0.3s">0.3s</option>
                <option value="0.5s">0.5s</option>
                <option value="1s" selected>1s</option>
                <option value="2s">2s</option>
                <option value="4s">4s</option>
              </select>
            </label>
            <label class="label" title="Stop fitting each render to the column and show it at its own size"
              ><input type="checkbox" id="actualSize" /> actual size</label
            >
          </div>
          <!-- both renderers in the same box, the top one clipped to the wipe, so
           anything out of place shows as a jump across the divider. Which one
           is on which side is said on the render rather than beside the slider,
           since the slider is the divider and at either end one of them has the
           whole width -->
          <div id="stage" class="stage">
            <div id="overlay" class="overlay">
              <div class="layer">
                <span class="side">canvas</span>
                <div id="visA"></div>
              </div>
              <div class="layer top">
                <span class="side">webgpu</span>
                <div id="visB"></div>
              </div>
            </div>
          </div>
        </div>
        <div id="diffPanel" hidden>
          <div id="diffSummary" class="label"></div>
          <canvas id="diffCanvas"></canvas>
        </div>
        <!-- one set of bound inputs drives every view, so a diff compares the same state -->
        <section id="bindPanel" hidden>
          <h2>Spec controls</h2>
          <div id="binds"></div>
        </section>
      </div>
      <footer id="pagefoot" class="foot">
        <span class="who">vega-webgpu, an unofficial WebGPU renderer for Vega</span>
        <a href="../">Project page</a>
        <a href="../releases/marks.html">Mark playground</a>
        <a href="https://github.com/KaNaDaAT/vega-webgpu">GitHub</a>
        <a href="../releases/impressum.html">Impressum</a>
      </footer>
    </main>
  </body>
</html>
